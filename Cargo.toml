[package]
name = "installxs"
version = "0.1.0"
edition = "2024"
authors = ["sahilcodex"]
description = "Universal Linux App Manager and Drop-to-Install Hub with Material Design 3"

[dependencies]
gpui = "0.2.2"
gpui-m3 = { path = "crates/gpui-m3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
walkdir = "2.5"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
xz2 = "0.1"
uuid = { version = "1.15", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.17"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"
open = "5.3"
which = "7.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = ">=0.2.150, <0.2.190"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
